<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal de Horas</title>
  <link rel="icon" type="image/png" href="assets/logo-centric.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="assets/logo-centric.png" sizes="192x192" />
  <style>
    :root {
      --bg: #0b0a13;
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.7);
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #8b5cf6;
      --accent-2: #7c3aed;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(139, 92, 246, 0.35), transparent 60%),
        radial-gradient(900px 500px at 100% 20%, rgba(167, 139, 250, 0.2), transparent 55%),
        var(--bg);
    }

    main {
      width: min(100%, 720px);
      padding: 40px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    .logo { height: 48px; width: auto; margin-bottom: 10px; }
    .brand {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(26px, 5vw, 34px); letter-spacing: -0.5px; }
    p { max-width: 500px; margin: 12px auto 30px; color: var(--muted); line-height: 1.5; }

    .services {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .service-link {
      display: flex;
      min-height: 116px;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .service-link:hover,
    .service-link:focus-visible {
      border-color: rgba(139, 92, 246, 0.75);
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      outline: none;
      transform: translateY(-2px);
    }

    .footer {
      margin: 22px 0 0;
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      main { padding: 32px 20px; }
      .services { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/logo-centric.png" alt="Centric" class="logo" />
    <div class="brand">Centric</div>
    <h1>Portal de Horas</h1>
    <p>Escolha o serviço para consultar as horas estimadas e o escopo correspondente.</p>
    <nav class="services" aria-label="Serviços disponíveis">
      <a class="service-link" href="implantacao.html">Implantação</a>
      <a class="service-link" href="treinamento.html">Treinamento</a>
    </nav>
    <div class="footer">Centric • ManageEngine • Portal de horas de implantação e treinamento</div>
  </main>
</body>
</html>
